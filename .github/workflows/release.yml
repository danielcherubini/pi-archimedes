name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write  # for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # No `registry-url` here: it makes actions/setup-node export a placeholder
      # NODE_AUTH_TOKEN and write _authToken into NPM_CONFIG_USERCONFIG's .npmrc,
      # which makes npm/pnpm prefer token auth over the OIDC trusted-publisher
      # flow and publish fails with a 404 (actions/setup-node#1551, npm/cli#8730).
      # Node 24 ships npm 11.x, which trusted publishing requires (npm >= 11.5.1).
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check all packages
        run: pnpm -r exec -- tsc --noEmit

      - name: Publish to npm
        # Belt and braces: make sure no residual token can shadow the OIDC flow.
        run: |
          unset NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG 2>/dev/null || true
          # Publish component packages first, then meta (dependency order)
          pnpm --filter "@pi-archimedes/core" publish --access public --no-git-checks --provenance
          pnpm --filter "@pi-archimedes/sudo" publish --access public --no-git-checks --provenance
          pnpm --filter "@pi-archimedes/ask" publish --access public --no-git-checks --provenance
          pnpm --filter "@pi-archimedes/todo" publish --access public --no-git-checks --provenance
          pnpm --filter "@pi-archimedes/notify" publish --access public --no-git-checks --provenance
          pnpm --filter "@pi-archimedes/session-name" publish --access public --no-git-checks --provenance
          pnpm --filter "@pi-archimedes/footer" publish --access public --no-git-checks --provenance
          pnpm --filter "@pi-archimedes/diff" publish --access public --no-git-checks --provenance
          pnpm --filter "@pi-archimedes/image-paste" publish --access public --no-git-checks --provenance
          pnpm --filter "@pi-archimedes/subagent" publish --access public --no-git-checks --provenance
          pnpm --filter "@pi-archimedes/mcp" publish --access public --no-git-checks --provenance
          pnpm --filter "pi-archimedes" publish --access public --no-git-checks --provenance
