name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write  # for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # No `registry-url` here: it makes actions/setup-node export a placeholder
      # NODE_AUTH_TOKEN and write _authToken into NPM_CONFIG_USERCONFIG's .npmrc,
      # which makes npm/pnpm prefer token auth over the OIDC trusted-publisher
      # flow and publish fails with a 404 (actions/setup-node#1551, npm/cli#8730).
      # Node 24 ships npm 11.x, which trusted publishing requires (npm >= 11.5.1).
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check all packages
        run: pnpm -r exec -- tsc --noEmit

      - name: Stage to npm
        # Belt and braces: make sure no residual token can shadow the OIDC flow.
        #
        # Packages are staged using `pnpm stage publish` for review and approval
        # with 2FA on npmjs.com or via `npm stage approve`.
        # Skip versions already in the registry (makes a re-run safe), retry
        # transient flakes, and keep going so one bad package can't hide the rest.
        run: |
          unset NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG 2>/dev/null || true
          set -u

          # Dependency order: components first, meta last.
          ORDER="core ui sudo ask todo notify session-name footer diff image-paste subagent web"
          DIRS=""
          for p in $ORDER; do DIRS="$DIRS packages/$p"; done
          DIRS="$DIRS meta"

          failed=""
          for dir in $DIRS; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")

            staged=0
            for attempt in 1 2 3; do
              # Re-check every pass: a previous attempt may have reached the
              # registry and only failed on the way back out.
              if [ "$(npm view "$name@$version" version 2>/dev/null || true)" = "$version" ]; then
                echo "⏭️  $name@$version already on npm -- skipping"
                staged=1
                break
              fi

              if pnpm --filter "$name" stage publish --access public --no-git-checks --provenance; then
                echo "✅ Staged $name@$version"
                staged=1
                break
              fi

              echo "::warning::$name stage publish attempt $attempt/3 failed"
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 20))
              fi
            done

            [ "$staged" -eq 1 ] || failed="$failed $name@$version"
          done

          if [ -n "$failed" ]; then
            echo "##[error]Failed to stage:$failed"
            exit 1
          fi
